name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Node 24–ready action majors (avoids Node 20 deprecation annotations on GHA)
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Must match global.json sdk.version (rollForward latestPatch only accepts >= that patch band)
          dotnet-version: '10.0.110'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore UniversalTestFramework.sln

      - name: Build
        run: dotnet build UniversalTestFramework.sln -c Debug --no-restore

      - name: Test
        env:
          UTFF_ALLOW_UNSIGNED_PLUGINS: '1'
        run: >
          dotnet test UniversalTestFramework.sln
          --no-build -c Debug
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/*.xml
          if-no-files-found: warn

  release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Must match global.json sdk.version
          dotnet-version: '10.0.110'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore UniversalTestFramework.sln

      - name: Build Release
        run: dotnet build UniversalTestFramework.sln -c Release --no-restore --no-incremental
